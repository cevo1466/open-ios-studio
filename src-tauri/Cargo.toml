[package]
name = "open-ios-studio"
version = "0.2.0"
description = "AI-assisted iOS development environment built on xtool"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "open_ios_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "io-util", "rt"] }
portable-pty = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
plist = { version = "1", default-features = false }
sha2 = "0.11"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
base64 = "0.22"
flate2 = "1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
