name: Build and verify Windows simulator
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
            tools/simulator-harness
      - name: Install official Swift Windows toolchain
        shell: pwsh
        run: ./scripts/setup-swift-windows.ps1
      - run: npm ci
      - name: Native Windows Swift state, callbacks, Unicode, rebuild and failures
        run: cargo test --locked --manifest-path tools/simulator-harness/Cargo.toml
      - name: Build per-user Windows installer
        run: npx tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis
      - name: Native Windows Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Install package and verify its embedded simulator
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $target = Join-Path $env:RUNNER_TEMP 'ois-windows-installed'
          $process = Start-Process $installer[0].FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          python scripts/verify-simulator-windows.py --installed-dir $target --output windows-verification/package.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed simulator verification failed' }
          "OIS_INSTALLED_DIR=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Installed Tauri WebView2 editor and device interaction
        run: node scripts/verify-windows-desktop.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: open-ios-studio-windows-x86_64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            windows-verification/*.json
            ${{ runner.temp }}/swift-install*.log
          if-no-files-found: warn
