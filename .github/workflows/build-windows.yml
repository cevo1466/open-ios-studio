name: Build and verify Windows simulator
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
            tools/simulator-harness
      - name: Install official Swift Windows toolchain
        shell: pwsh
        run: ./scripts/setup-swift-windows.ps1
      - run: npm ci
      - name: Native Windows Swift state, callbacks, Unicode, rebuild and failures
        run: cargo test --locked --manifest-path tools/simulator-harness/Cargo.toml
      - name: Build per-user Windows installer
        run: npx tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis
      - name: Install package and verify its embedded simulator
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $target = Join-Path $env:RUNNER_TEMP 'ois-windows-installed'
          $process = Start-Process $installer[0].FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          python scripts/verify-simulator-windows.py --installed-dir $target --output windows-verification/package.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed simulator verification failed' }
          "OIS_INSTALLED_DIR=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Installed Tauri WebView2 editor and device interaction
        timeout-minutes: 7
        run: node scripts/verify-windows-desktop.mjs
      - name: Windows rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Windows clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Windows Rust tests
        timeout-minutes: 8
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Collect installer, checksums and verification
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 1) {
            $name = "Open-iOS-Studio_${version}_x64-setup.exe"
            Copy-Item $installers[0].FullName "dist-windows/$name"
            $hash = (Get-FileHash "dist-windows/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Out-File dist-windows/SHA256SUMS-Windows.txt -Encoding ascii
          }
          if (Test-Path windows-verification/package.json) { Copy-Item windows-verification/package.json dist-windows/WINDOWS_SIMULATOR_VERIFICATION.json }
          if (Test-Path windows-verification/desktop.json) { Copy-Item windows-verification/desktop.json dist-windows/WINDOWS_DESKTOP_VERIFICATION.json }
          New-Item -ItemType Directory -Force dist-windows/logs | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/swift-install*.log" -ErrorAction SilentlyContinue | Copy-Item -Destination dist-windows/logs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: open-ios-studio-windows-x86_64
          path: dist-windows/
          if-no-files-found: warn
