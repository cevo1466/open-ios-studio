name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high and critical fail the job)
        run: npm audit --audit-level=high

  policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Policy catalog schema and honesty checks
        run: node scripts/validate-policies.mjs
      - name: Release gate self-test
        run: node scripts/policy-gate.mjs --self-test
      - name: Policy engine tests (rules, detectors, remediation, prompt context)
        run: npx vitest run src/policy

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Frontend build (Tauri embeds ../dist)
        run: npm ci && npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  cargo-audit:
    # Advisory job: failures are visible in the run but do not block merging yet.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip until Cargo.lock is committed
        if: hashFiles('src-tauri/Cargo.lock') == ''
        run: echo "No Cargo.lock committed yet; cargo audit skipped (NOT VERIFIED)."
      - if: hashFiles('src-tauri/Cargo.lock') != ''
        run: cargo install cargo-audit --locked
      - if: hashFiles('src-tauri/Cargo.lock') != ''
        run: cargo audit --file src-tauri/Cargo.lock
