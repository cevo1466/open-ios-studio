name: Build Linux packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build DEB and AppImage
        run: npx tauri build --bundles deb,appimage
      - name: Checksums and package inspection
        working-directory: src-tauri/target/release/bundle
        run: |
          sha256sum deb/*.deb appimage/*.AppImage | tee SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          for f in deb/*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f" | head -40; done
          ls -l appimage
      - uses: actions/upload-artifact@v4
        with:
          name: open-ios-studio-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS.txt
            src-tauri/Cargo.lock
          if-no-files-found: error
